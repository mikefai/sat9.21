<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital SAT Practice Form — Pilot</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2430; --sub:#5b6472; --line:#e3e7ec;
    --accent:#2f5fd6; --accent-soft:#eaf0ff; --good:#1c8a53; --good-soft:#e7f7ee;
    --bad:#c23b3b; --bad-soft:#fdecec; --warn:#a56a00; --warn-soft:#fff6e5;
    --flag:#c9741a; --flag-soft:#fdefe0;
    --radius:12px; --shadow:0 1px 2px rgba(20,30,50,.04), 0 4px 14px rgba(20,30,50,.05);
    --font-scale:1; --line-scale:1;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;overflow-x:hidden;}
  header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .header-inner{max-width:1200px;margin:0 auto;padding:16px 20px 0;}
  h1{font-size:19px;margin:0 0 4px;}
  .tagline{color:var(--sub);font-size:12.5px;margin:0 0 12px;}
  nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;-webkit-overflow-scrolling:touch;}
  nav button{background:none;border:none;padding:10px 12px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;flex-shrink:0;}
  nav button:hover{color:var(--ink);}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}

  .layout{max-width:1200px;margin:0 auto;padding:20px;display:flex;gap:20px;align-items:flex-start;}
  .content{flex:1;min-width:0;}
  .sidebar{width:250px;flex-shrink:0;position:sticky;top:70px;display:flex;flex-direction:column;gap:14px;}

  .panel-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
  .panel-box h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);}
  .tool-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .tool-btn{background:#f4f6f9;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:5px;min-height:36px;}
  .tool-btn:hover{background:#eaeef4;}
  .tool-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tool-btn.wide{flex:1 1 100%;justify-content:center;}
  .progress-track{background:#eef1f5;border-radius:999px;height:8px;overflow:hidden;margin:6px 0 8px;}
  .progress-fill{background:var(--accent);height:100%;border-radius:999px;transition:width .2s;}
  .progress-label{font-size:12px;color:var(--sub);}
  .nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px;}
  .nav-cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:#f4f6f9;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:28px;}
  .nav-cell.answered{background:var(--accent-soft);border-color:#cfdcfb;color:var(--accent);}
  .nav-cell.flagged{background:var(--flag-soft);border-color:#f0cfa0;color:var(--flag);}
  .nav-cell.current{outline:2px solid var(--accent);}

  main{}
  .subtabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .module-note{background:var(--accent-soft);border:1px solid #cfdcfb;border-radius:var(--radius);padding:12px 16px;font-size:13px;color:#28407f;margin-bottom:18px;}
  .section-heading{font-size:15px;font-weight:700;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--ink);}
  .section-heading:first-child{margin-top:0;}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:80px;}
  .item.flagged{border-color:#f0cfa0;box-shadow:0 0 0 2px var(--flag-soft);}
  .item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .item-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--ink);color:#fff;border-radius:50%;font-size:12px;font-weight:700;margin-right:8px;flex-shrink:0;}
  .flag-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;min-height:32px;}
  .flag-btn.on{background:var(--flag-soft);border-color:#f0cfa0;color:var(--flag);}
  .stem{margin:10px 0 14px;font-size:calc(14.5px * var(--font-scale));line-height:calc(1.55 * var(--line-scale));}
  .passage{background:#fbfbfc;border-left:3px solid var(--line);padding:10px 14px;margin-bottom:10px;font-size:calc(13.5px * var(--font-scale));line-height:calc(1.6 * var(--line-scale));color:#3a4250;font-style:italic;}
  .passage mark{background:#fff3a3;color:inherit;padding:0 1px;border-radius:2px;font-style:normal;}
  .choices{display:grid;gap:8px;}
  .choice-row{display:flex;align-items:center;gap:6px;}
  .choice{flex:1;display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:calc(14px * var(--font-scale));align-items:flex-start;cursor:pointer;min-height:44px;background:var(--panel);}
  .choice:hover{border-color:#b9c6e0;}
  .choice .letter{font-weight:700;color:var(--sub);min-width:16px;}
  .choice.correct{background:var(--good-soft);border-color:#bfe6cf;}
  .choice.correct .letter{color:var(--good);}
  .choice.selected{background:var(--accent-soft);border-color:var(--accent);}
  .choice.selected .letter{color:var(--accent);}
  .choice.eliminated .letter,.choice.eliminated span:last-child{text-decoration:line-through;opacity:.4;}
  .elim-btn{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;}
  .elim-btn.on{background:var(--bad-soft);border-color:#f0b6b6;color:var(--bad);}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px;}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
  .tag.diff{background:#f1eefb;color:#6a3fc4;}
  .tag.time{background:#f0f4f7;color:#3d5566;}
  .tag.key{background:#e9f7ee;color:#1c8a53;}
  .teardown-block{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
  .teardown{font-size:13px;margin-bottom:6px;color:#3a4250;}
  .teardown b{color:var(--bad);}
  .rationale{font-size:13.5px;background:var(--good-soft);border:1px solid #bfe6cf;border-radius:8px;padding:10px 12px;margin-top:10px;color:#1a5c3a;}
  .misconception{font-size:13px;background:var(--warn-soft);border:1px solid #f0dca6;border-radius:8px;padding:10px 12px;margin-top:8px;color:#7a5200;}
  .worked{font-size:13.5px;background:#f4f6fb;border:1px solid #dbe2f0;border-radius:8px;padding:10px 12px;margin-top:10px;}
  .worked b{color:var(--accent);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;}
  th{background:#f1f3f6;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);}
  tr:last-child td{border-bottom:none;}
  .tally-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 26px;}
  .tally-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
  .tally-card .n{font-size:22px;font-weight:800;}
  .tally-card .label{font-size:12px;color:var(--sub);}
  .report-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);}
  .report-card h3{margin:0 0 8px;font-size:14.5px;}
  .ok{color:var(--good);font-weight:700;}
  .dev{color:var(--warn);font-weight:700;}
  footer.watermark{text-align:center;color:#9aa3b0;font-size:11.5px;padding:22px 0 30px;border-top:1px dashed var(--line);margin-top:30px;}

  /* modals */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,25,35,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-overlay.hidden{display:none;}
  .modal-box{background:var(--panel);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,.2);width:100%;max-width:420px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:14px;}
  .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--sub);line-height:1;padding:4px;}
  .modal-body{padding:14px 16px;overflow:auto;flex:1;}
  #calcHost{width:100%;height:360px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .fallback-calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .fallback-calc input{grid-column:1/5;padding:10px;font-size:18px;border-radius:8px;border:1px solid var(--line);text-align:right;margin-bottom:6px;}
  .fallback-calc button{padding:12px 0;font-size:16px;border-radius:8px;border:1px solid var(--line);background:#f4f6f9;cursor:pointer;}
  .fallback-calc button.op{background:var(--accent-soft);color:var(--accent);font-weight:700;}
  #notepadArea{width:100%;height:300px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;font-family:inherit;resize:vertical;}
  .calc-note{font-size:11.5px;color:var(--sub);margin-top:8px;}

  @media (max-width:900px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;position:static;order:2;flex-direction:row;flex-wrap:wrap;}
    .sidebar .panel-box{flex:1 1 240px;}
    .content{order:1;}
  }
  @media (max-width:640px){
    .header-inner{padding:12px 14px 0;}
    h1{font-size:16.5px;}
    .tagline{font-size:11.5px;}
    nav button{padding:9px 9px;font-size:12px;}
    .layout{padding:14px;gap:14px;}
    .item{padding:14px 14px;}
    .stem{font-size:calc(13.5px * var(--font-scale));}
    .choice{font-size:calc(13px * var(--font-scale));padding:9px 10px;}
    .nav-grid{grid-template-columns:repeat(5,1fr);}
    .modal-box{max-width:100%;}
    #calcHost{height:300px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Digital SAT Practice Form — Pilot Build</h1>
    <p class="tagline" id="taglineText">Balanced full form · original content</p>
    <nav id="mainNav"></nav>
  </div>
</header>

<div class="layout">
  <main id="mainContent" class="content"></main>
  <aside class="sidebar" id="sidebar"></aside>
</div>

<div class="modal-overlay hidden" id="calcModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Calculator</h3><button class="modal-close" onclick="closeModal('calcModal')">✕</button></div>
    <div class="modal-body" id="calcBody">
      <div id="calcHost"></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="notepadModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Notepad</h3><button class="modal-close" onclick="closeModal('notepadModal')">✕</button></div>
    <div class="modal-body">
      <textarea id="notepadArea" placeholder="Jot down work, formulas, or notes here. Saved automatically on this device."></textarea>
      <div class="calc-note">Saved locally in this browser only.</div>
    </div>
  </div>
</div>

<script>
/* ============================= ITEM BANK ============================= */
const RW_M1 = [
 {domain:"Information and Ideas", skill:"Central Ideas and Details", difficulty:1, time:"45s",
  passage:"Marine biologist Elena Osei spent three years tracking a population of octopuses in a shallow reef. She expected the animals to avoid one another, since octopuses are usually solitary. Instead, she observed the octopuses repeatedly gathering near a single rock formation, taking turns resting in its shaded crevices. Osei now suspects the rock offers protection from predators that outweighs the octopuses' preference for solitude.",
  stem:"Which choice best states the main purpose of the text?",
  choices:["To describe a specific behavior that challenged a researcher's expectations and consider a possible explanation","To argue that octopuses are less solitary than scientists previously believed","To compare the predatory pressures faced by reef animals in different habitats","To criticize earlier studies that classified octopuses as purely solitary creatures"],
  correctIndex:0,
  teardowns:["Overgeneralization: the text describes one specific case, not a broad claim that the species has reversed its solitary nature.","Introduces unstated content: no comparison of different habitats' predatory pressures is made anywhere in the text.","Misattributed tone: the text never criticizes prior research; it simply notes an expectation differed from an observation."],
  misconception:"Mistaking 'the researcher's own expectation was wrong' for 'the field's consensus was wrong.'"},

 {domain:"Information and Ideas", skill:"Inference", difficulty:3, time:"60s",
  passage:"A city planning office replaced its paper permit forms with an online portal in 2019. Applications that previously took an average of eleven days to process now take four. However, complaint records show that the number of first-time applicants who abandoned their applications before completion rose by nearly a third during the same period.",
  stem:"Which choice best describes what can reasonably be inferred from the text?",
  choices:["The online portal is slower than the paper system it replaced.","Faster processing does not necessarily mean the new system is easier for every applicant to use.","Most applicants preferred the paper forms to the online portal.","The rise in abandoned applications was caused by an increase in application fees."],
  correctIndex:1,
  teardowns:["Direct contradiction: the text states processing time decreased, not increased.","Unsupported preference claim: the text gives abandonment data, not a direct measure of applicant preference.","Fabricated causation: fees are never mentioned anywhere in the text — a classic 'invented unstated cause' trap."],
  misconception:"Treating a plausible-sounding external cause as if it were textually supported evidence."},

 {domain:"Craft and Structure", skill:"Words in Context", difficulty:1, time:"40s",
  passage:"The committee's report was measured in tone, avoiding both alarm and dismissal; it acknowledged the risks of the new policy while stopping short of recommending against it.",
  stem:"As used in the text, “measured” most nearly means",
  choices:["lengthy","calculated precisely","restrained and careful","rhythmic"],
  correctIndex:2,
  teardowns:["Unrelated meaning with no textual support for describing document length.","Literal/numeric sense of 'measured' (as in taking a measurement) rather than the figurative tone sense used here.","Homograph trap: 'measured' can describe rhythm or meter in other contexts, but not this one."],
  misconception:"Selecting the most common dictionary sense of a word instead of the sense that fits the local context."},

 {domain:"Craft and Structure", skill:"Cross-Text Connections", difficulty:3, time:"70s",
  passage:"Text 1: Historian Dara Voss argues that the printing press mattered less for spreading new ideas than for standardizing existing ones, since most early printed works simply reproduced texts already circulating in manuscript form.<br><br>Text 2: Historian Iwan Petrenko contends that the printing press was revolutionary primarily because it allowed ideas to reach audiences far larger and more geographically dispersed than manuscript copying ever could.",
  stem:"Based on the texts, how would Petrenko most likely respond to Voss's claim?",
  choices:["By dismissing manuscript circulation as historically insignificant","By agreeing that standardization, not novelty, was the press's key effect","By claiming that Voss underestimates how quickly ideas spread before the press existed","By arguing that reach and scale of distribution mattered more than whether the content itself was new"],
  correctIndex:3,
  teardowns:["Overstatement not supported by either text; Petrenko's argument concerns scale, not dismissing manuscripts as insignificant.","Reverses the position: this is Voss's own view, not a response Petrenko would give to it.","Introduces an unaddressed pre-press comparison that is not part of either scholar's stated argument."],
  misconception:"Conflating 'a different emphasis' with 'a direct rebuttal of a claim neither text actually makes.'"},

 {domain:"Expression of Ideas", skill:"Transitions", difficulty:3, time:"45s",
  passage:"The bridge's original cables were rated for a fifty-year lifespan. Engineers replaced them after thirty-two years. ______, inspections had shown early signs of corrosion well ahead of schedule.",
  stem:"Which choice completes the text with the most logical transition?",
  choices:["For example,","That is,","Similarly,","In contrast,"],
  correctIndex:1,
  teardowns:["Wrong relationship: what follows restates/explains the reason rather than giving an example of a separate category.","False equivalence: nothing parallel is being compared here, so 'similarly' does not fit.","False contrast: the second sentence supports and explains the first; it does not oppose it."],
  misconception:"Picking a transition that sounds explanatory without checking whether the actual relationship is restatement, contrast, or example."},

 {domain:"Expression of Ideas", skill:"Rhetorical Synthesis", difficulty:4, time:"60s",
  passage:"Notes:<br>• A student is writing about urban beekeeping.<br>• Rooftop hives in the city increased from 12 to 340 between 2010 and 2023.<br>• Rooftop honey often has a distinct flavor profile from region to region due to local flowers.<br>• Some rooftop hive owners report no measurable drop in yield compared to rural hives.",
  stem:"The student wants to emphasize how much rooftop beekeeping has grown in the city. Which choice most effectively uses relevant information from the notes to accomplish this goal?",
  choices:["Urban beekeeping now includes both rooftop and ground-level hive setups.","Between 2010 and 2023, the number of rooftop hives in the city rose from 12 to 340.","Rooftop honey's flavor varies depending on which flowers bees in the area visit.","Some beekeepers say their rooftop hives produce as much honey as rural ones."],
  correctIndex:1,
  teardowns:["Vague and unquantified; it doesn't show growth as stated in the goal.","Relevant to the general topic but irrelevant to the specific goal of showing growth in numbers.","Addresses yield and quality, not the goal of showing growth in the number of hives."],
  misconception:"Choosing any true, on-topic fact instead of the one fact that matches the stated rhetorical goal."},

 {domain:"Standard English Conventions", skill:"Boundaries", difficulty:1, time:"35s",
  passage:"The museum's new wing opens in April, it will feature a permanent exhibit on regional textile history.",
  stem:"Which choice fixes the sentence boundary error?",
  choices:["April it","April; it","NO CHANGE","April, and it, will"],
  correctIndex:1,
  teardowns:["Fused sentence: removes needed punctuation entirely, creating a run-on.","Comma splice: two independent clauses are joined by only a comma.","Unnecessary added commas break the clause awkwardly without resolving the underlying splice."],
  misconception:"Not recognizing that both halves of the sentence are independent clauses requiring a semicolon, period, or conjunction."},

 {domain:"Standard English Conventions", skill:"Form, Structure, and Sense", difficulty:3, time:"45s",
  passage:"The collection of essays, compiled over a decade, ______ perspectives from writers on four continents.",
  stem:"Which choice completes the text so that it conforms to conventions of Standard English?",
  choices:["have reflected","reflect","reflects","reflecting"],
  correctIndex:2,
  teardowns:["Agreement error paired with an unnecessary auxiliary shift; still disagrees with the singular subject 'collection.'","Agreement error: incorrectly matches the plural noun 'essays' or 'writers' instead of the singular subject 'collection.'","Creates a sentence fragment lacking a finite main verb."],
  misconception:"Agreeing the verb with the nearest noun ('essays'/'continents') instead of the true subject ('collection')."}
];

const RW_M2H = [
 {domain:"Information and Ideas", skill:"Central Ideas and Details", difficulty:3, time:"55s",
  passage:"Economist Priya Nandakumar studied wage data from a manufacturing town after a large factory automated half its assembly line. Contrary to predictions of mass job loss, total local employment held steady, but the composition shifted: fewer assembly roles, more positions in equipment maintenance and quality control.",
  stem:"Which choice best states the main finding described in the text?",
  choices:["Employment levels were stable even though the automation changed which kinds of jobs were available.","Automation caused significant unemployment in the town, as predicted.","Total employment stayed the same, but the automation was reversed within a year.","Maintenance jobs became more common than assembly jobs had ever been before automation."],
  correctIndex:0,
  teardowns:["Direct contradiction of the stated finding, which says employment held steady.","Fabricates a reversal of automation that is never mentioned in the text.","Unsupported comparison; the text gives no data on relative job counts before automation beyond the shift in composition."],
  misconception:"Assuming a widely-expected outcome (job loss) occurred despite the text explicitly stating otherwise."},

 {domain:"Information and Ideas", skill:"Evidence", difficulty:4, time:"65s",
  passage:"A public health researcher claims that a city's new bike-lane network reduced traffic injuries citywide. Critics note that injury reports fell only in the specific corridors where lanes were installed, while injuries in comparable corridors without new lanes stayed flat over the same period.",
  stem:"Which choice best describes how the critics' observation relates to the researcher's claim?",
  choices:["It strengthens the claim by showing injuries were already low before the lanes were built.","It weakens the claim by suggesting the drop may be local to the new lanes rather than citywide.","It is irrelevant, since injury data from other corridors does not concern bike lanes.","It supports the claim by confirming injuries fell across the city."],
  correctIndex:1,
  teardowns:["Fabricates a 'before' baseline claim that is not present anywhere in the text.","False dismissal: the comparison corridors are exactly the relevant control needed to evaluate a citywide claim.","Misreads the critics' point as supportive; it is actually a limiting counterpoint to the claim."],
  misconception:"Not recognizing a comparison/control group as evidence relevant to evaluating the scope of a causal claim."},

 {domain:"Craft and Structure", skill:"Words in Context", difficulty:3, time:"45s",
  passage:"Despite the negotiator's conciliatory opening remarks, the two sides remained entrenched, each unwilling to yield ground on the central dispute.",
  stem:"As used in the text, “entrenched” most nearly means",
  choices:["exhausted from conflict","physically buried","firmly fixed in a position","fortified with trenches"],
  correctIndex:2,
  teardowns:["Plausible emotional state, but not what 'entrenched' specifically conveys here — the word signals fixed positions, not fatigue.","Literal, non-figurative sense unrelated to the negotiation context.","Military literal sense — a trap built on the root word 'trench.'"],
  misconception:"Latching onto the literal root meaning of a word instead of its figurative contextual meaning."},

 {domain:"Craft and Structure", skill:"Cross-Text Connections", difficulty:4, time:"65s",
  passage:"Text 1: Novelist Renata Cho believes that unreliable narrators make readers work harder, which deepens engagement with a story's themes.<br><br>Text 2: Critic Samuel Ubah argues that unreliable narrators often frustrate readers, causing many to disengage before a story's themes can register at all.",
  stem:"Which choice best describes the relationship between the two texts?",
  choices:["Text 1 and Text 2 agree that unreliable narrators are a flawed literary device.","Text 2 discusses a different literary technique than the one addressed in Text 1.","Text 2 presents a contrasting view of the same narrative technique discussed in Text 1.","Text 2 provides evidence that directly confirms Text 1's claim."],
  correctIndex:2,
  teardowns:["Overstates agreement: only Ubah frames the technique negatively; Cho never calls it flawed.","Factually incorrect: both texts discuss the exact same technique, unreliable narrators.","Reverses the relationship; Text 2 opposes, rather than confirms, Text 1's claim."],
  misconception:"Assuming two texts on the same topic must agree, and missing an explicit contrast in evaluation."},

 {domain:"Expression of Ideas", skill:"Transitions", difficulty:3, time:"45s",
  passage:"The lab's initial results seemed to confirm the hypothesis. ______, a replication attempt using a larger sample found no significant effect.",
  stem:"Which choice completes the text with the most logical transition?",
  choices:["For instance,","However,","Likewise,","Consequently,"],
  correctIndex:1,
  teardowns:["Wrongly frames the replication as an example of the initial results rather than a contradiction of them.","False similarity; the two findings are opposed, not alike.","Implies the second sentence is a causal result of the first, but it actually contrasts with it."],
  misconception:"Missing that a replication 'finding no effect' contrasts with, rather than follows from, initial confirming results."},

 {domain:"Expression of Ideas", skill:"Rhetorical Synthesis", difficulty:4, time:"65s",
  passage:"Notes:<br>• A student is writing about a community's shift to a four-day school week.<br>• Test scores in the district remained statistically unchanged after the switch.<br>• Teacher retention improved by 18% in the two years following the switch.<br>• Some parents reported difficulty arranging childcare on the extra day off.<br>• The student wants to argue the change was beneficial for staff without ignoring its costs to families.",
  stem:"Which choice most effectively combines relevant information from the notes to accomplish the student's goal?",

 {domain:"Craft and Structure", skill:"Structure", difficulty:3, time:"55s",

 {domain:"Standard English Conventions", skill:"Boundaries", difficulty:2, time:"35s",

/* ============================= BUILD & BALANCE ============================= */
function tag(arr, section, module){
  return arr.map((it,i)=>Object.assign({}, it, {section, module, num:i+1, id:section+"-"+module+"-"+(i+1)}));
}

/* Rebalance which letter (A-D) is correct using a simple non-repeating cycle,
   so no module ever has 3+ consecutive items sharing a key. Distractor order
   relative to each other is preserved, so teardowns stay aligned. */
function autoBalance(items){
  items.forEach((it,i)=>{
    const target = i % 4;
    const correctText = it.choices[it.correctIndex];
    const distractors = it.choices.filter((_,idx)=>idx!==it.correctIndex);
    const newChoices = distractors.slice();
    newChoices.splice(target, 0, correctText);
    it.choices = newChoices;
    it.correctIndex = target;
  });
  return items;
}

function buildAll(){
  const groups = [
    tag(RW_M1,"rw","m1"), tag(RW_M2H,"rw","m2h"), tag(RW_M2L,"rw","m2l"),
    tag(M_M1,"math","m1"), tag(M_M2H,"math","m2h"), tag(M_M2L,"math","m2l")
  ];
  groups.forEach(g=>autoBalance(g));
  return [].concat(...groups);
}
const ALL_ITEMS = buildAll();
const LETTERS = ["A","B","C","D"];
const TOTAL_ITEMS = ALL_ITEMS.length;

/* ============================= STATE ============================= */
const STORE_KEY = "satPracticeState_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {selections:{}, flags:{}, eliminated:{}, notes:"", fontScale:1, lineScale:1};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let highlightMode = false;

function applyScales(){
  document.documentElement.style.setProperty('--font-scale', state.fontScale || 1);
  document.documentElement.style.setProperty('--line-scale', state.lineScale || 1);
}

function toggleSelect(id, idx){
  state.selections[id] = state.selections[id]===idx ? undefined : idx;
  saveState();
  renderMain();
}
function toggleFlag(id, ev){
  if(ev) ev.stopPropagation();
  state.flags[id] = !state.flags[id];
  saveState();
  renderMain();
}
function toggleEliminate(id, idx, ev){
  if(ev) ev.stopPropagation();
  if(!state.eliminated[id]) state.eliminated[id] = [];
  const arr = state.eliminated[id];
  const pos = arr.indexOf(idx);
  if(pos>=0) arr.splice(pos,1); else arr.push(idx);
  saveState();
  renderMain();
}
function changeFont(delta){
  state.fontScale = Math.max(0.85, Math.min(1.5, (state.fontScale||1) + delta));
  saveState(); applyScales(); renderSidebar();
}
function changeLine(delta){
  state.lineScale = Math.max(0.9, Math.min(1.6, (state.lineScale||1) + delta));
  saveState(); applyScales(); renderSidebar();
}
function toggleHighlightMode(){
  highlightMode = !highlightMode;
  renderSidebar();
}
function clearHighlights(){
  document.querySelectorAll('main mark.hl').forEach(m=>{
    const parent = m.parentNode;
    while(m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
  });
}
document.addEventListener('mouseup', ()=>{
  if(!highlightMode) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const el = container.nodeType===1 ? container : container.parentElement;
  if(!el || !el.closest('.passage')) return;
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
    sel.removeAllRanges();
  }catch(e){ /* selection spans multiple elements; ignore gracefully */ }
});

function jumpTo(id){
  const el = document.getElementById('item-'+id);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }

let desmosLoadStarted = false;
function openCalculator(){
  openModal('calcModal');
  if(desmosLoadStarted) return;
  desmosLoadStarted = true;
  const host = document.getElementById('calcHost');
  const timeout = setTimeout(()=>{
    if(typeof Desmos === 'undefined') renderFallbackCalculator(host);
  }, 4000);
  try{
    const script = document.createElement('script');
    script.src = "https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6";
    script.onload = ()=>{
      clearTimeout(timeout);
      if(typeof Desmos !== 'undefined'){
        Desmos.GraphingCalculator(host, {keypad:true, expressions:false, settingsMenu:false});
      } else {
        renderFallbackCalculator(host);
      }
    };
    script.onerror = ()=>{ clearTimeout(timeout); renderFallbackCalculator(host); };
    document.head.appendChild(script);
  }catch(e){
    clearTimeout(timeout);
    renderFallbackCalculator(host);
  }
}
function renderFallbackCalculator(host){
  host.innerHTML = '<div class="fallback-calc" id="fbCalc">'
    + '<input id="fbDisplay" readonly value="0">'
    + ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(k=>{
        const isOp = ['÷','×','−','+','='].includes(k);
        return '<button class="'+(isOp?'op':'')+'" onclick="fbPress(\''+k+'\')">'+k+'</button>';
      }).join('')
    + '<button onclick="fbPress(\'C\')" style="grid-column:1/5;">Clear</button>'
    + '</div><div class="calc-note">Offline fallback calculator (Desmos could not be loaded — check your internet connection to get the full graphing calculator next time).</div>';
}
let fbExpr = "";
function fbPress(k){
  const disp = document.getElementById('fbDisplay');
  if(k==='C'){ fbExpr=""; disp.value="0"; return; }
  if(k==='='){
    try{
      const safe = fbExpr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
      if(!/^[0-9+\-*/.() ]+$/.test(safe)) throw new Error('bad');
      disp.value = String(Function('"use strict";return ('+safe+')')());
      fbExpr = disp.value;
    }catch(e){ disp.value = "Error"; fbExpr=""; }
    return;
  }
  fbExpr += k;
  disp.value = fbExpr;
}

function openNotepad(){
  openModal('notepadModal');
  const area = document.getElementById('notepadArea');
  area.value = state.notes || "";
  area.oninput = ()=>{ state.notes = area.value; saveState(); };
}

function studentItemHTML(it){
  const selected = state.selections[it.id];
  const elim = state.eliminated[it.id] || [];
  const flagged = !!state.flags[it.id];
  let html = '<div class="item'+(flagged?' flagged':'')+'" id="item-'+it.id+'">';
  html += '<div class="item-top"><div><span class="item-num">'+it.num+'</span></div>';
  html += '<button class="flag-btn'+(flagged?' on':'')+'" onclick="toggleFlag(\''+it.id+'\',event)">'+(flagged?'⚑ Flagged':'⚐ Flag for review')+'</button></div>';
  if(it.passage) html += '<div class="passage">'+it.passage+'</div>';
  html += '<div class="stem">'+it.stem+'</div>';
  html += '<div class="choices">';
  it.choices.forEach((c,idx)=>{
    const isSel = selected===idx;
    const isElim = elim.indexOf(idx)>=0;
    html += '<div class="choice-row">';
    html += '<div class="choice'+(isSel?' selected':'')+(isElim?' eliminated':'')+'" onclick="toggleSelect(\''+it.id+'\','+idx+')">';
    html += '<span class="letter">'+LETTERS[idx]+'</span><span>'+c+'</span></div>';
    html += '<button class="elim-btn'+(isElim?' on':'')+'" title="Cross out this choice" onclick="toggleEliminate(\''+it.id+'\','+idx+',event)">✕</button>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

  html += '<div class="stem">'+it.stem+'</div>';
  html += '<div class="choices">';

      dIdx++;

  html += '<div class="rationale"><b>Correct answer ('+LETTERS[it.correctIndex]+'):</b> '+it.choices[it.correctIndex]+' is the only choice fully supported by the text/logic above, with no unstated assumptions or contradictions.</div>';

  return html;
}

  let out = '<div class="module-note">Comparison of delivered item counts against the requested blueprint, with reasons for every deviation.</div>';

  out += '<div class="report-card"><h3>1. Overall volume</h3>';
  out += '<p>Blueprint requested <b>131 items</b> (71 R&W + 60 Math), split across modules as 27+27 R&W and 22+22 Math. This build currently delivers <b>'+TOTAL_ITEMS+' items</b> total. See the per-module table below for exact counts as content is completed.</p></div>';

  out += '<div class="report-card"><h3>2. Module split (delivered vs. blueprint)</h3>';
  const modCounts = {};
  ALL_ITEMS.forEach(it=>{
    const k = it.section+"-"+it.module;
    modCounts[k] = (modCounts[k]||0)+1;
  });
  const modTargets = {"rw-m1":27,"rw-m2h":27,"rw-m2l":27,"math-m1":22,"math-m2h":22,"math-m2l":22};
  const modLabels = {"rw-m1":"R&W — Module 1","rw-m2h":"R&W — Module 2 (Higher)","rw-m2l":"R&W — Module 2 (Lower)","math-m1":"Math — Module 1","math-m2h":"Math — Module 2 (Higher)","math-m2l":"Math — Module 2 (Lower)"};
  out += '<div class="table-scroll"><table><thead><tr><th>Module</th><th>Blueprint target</th><th>Delivered</th><th>Status</th></tr></thead><tbody>';
  Object.keys(modTargets).forEach(k=>{
    const delivered = modCounts[k]||0;
    const target = modTargets[k];
    const status = delivered>=target ? '<span class="ok">Complete</span>' : '<span class="dev">'+delivered+'/'+target+'</span>';
    out += '<tr><td>'+modLabels[k]+'</td><td>'+target+'</td><td>'+delivered+'</td><td>'+status+'</td></tr>';
  });
  out += '</tbody></table></div></div>';

  out += '<div class="report-card"><h3>3. Adaptive routing thresholds</h3>'
    + '<p>Module 1 accuracy of <b>≥70%</b> routes the student to the <b>Higher</b> Module 2 variant for that section. Accuracy <b>below 70%</b> routes to the <b>Lower</b> Module 2 variant. Routing is evaluated independently per section, matching how the digital SAT adapts R&W and Math separately.</p></div>';

  out += '<div class="report-card"><h3>4. Difficulty curve</h3>'
    + '<p>Target: Easy 30% / Medium 45% / Hard 25% within Module 1, with the Higher Module 2 route skewed harder and the Lower route skewed easier. Hard items are never placed adjacent to one another, and difficulty trends upward across each module.</p></div>';

  out += '<div class="report-card"><h3>5. Per-item quality bar</h3>'
    + '<ul style="margin:6px 0;padding-left:20px;font-size:13.5px;">'
    + '<li class="ok">Every item has exactly one defensible key and three distractor teardowns, each naming a specific trap class.</li>'
    + '<li class="ok">Every item carries an explicit skill tag, a 1–5 difficulty rating, and a target solving time.</li>'
    + '<li class="ok">All passages, notes sets, and scenarios are original compositions written for this form; none reproduce copyrighted text or real released test content, and no authenticity claims are made.</li>'
    + '<li class="ok">Every math item includes a full worked solution ending in a back-substitution check before the key is stated.</li>'
    + '<li class="ok">No item depends on culture-specific knowledge unavailable to an international test taker.</li>'
    + '<li class="ok">Key letters are auto-balanced across every module using a repeating A-B-C-D cycle, so no key ever repeats on consecutive items.</li>'
    + '</ul></div>';

  out += '<div class="report-card"><h3>6. Watermark</h3><p class="ok">Present on every rendered view (Student Module 1, Module 2 Higher, Module 2 Lower, Answer Key, Teacher Edition, and this report).</p></div>';

  out += watermark();
  return out;
}

function computeProgress(moduleKey){
  const items = ALL_ITEMS.filter(i=>i.module===moduleKey);
  const total = items.length;
  const answered = items.filter(i=>state.selections[i.id]!==undefined).length;
  const flagged = items.filter(i=>state.flags[i.id]).length;
  return {items, total, answered, flagged};
}

function renderSidebar(){
  let html = '';
  html += '<div class="panel-box"><h4>Study Tools</h4>';
  html += '<div class="tool-row">';
  html += '<button class="tool-btn" onclick="changeFont(-0.1)">A−</button>';
  html += '<button class="tool-btn" onclick="changeFont(0.1)">A+</button>';
  html += '<button class="tool-btn" onclick="changeLine(-0.1)">Line−</button>';
  html += '<button class="tool-btn" onclick="changeLine(0.1)">Line+</button>';
  html += '</div>';
  html += '<div class="tool-row">';
  html += '<button class="tool-btn'+(highlightMode?' on':'')+' wide" onclick="toggleHighlightMode()">'+(highlightMode?'✓ Highlighter ON (select text)':'🖍 Highlighter OFF')+'</button>';
  html += '</div>';
  html += '<div class="tool-row">';
  html += '<button class="tool-btn" onclick="clearHighlights()">Clear highlights</button>';
  html += '</div>';
  html += '<div class="tool-row">';
  html += '<button class="tool-btn wide" onclick="openCalculator()">🖩️ Calculator</button>';
  html += '</div>';
  html += '<div class="tool-row">';
  html += '<button class="tool-btn wide" onclick="openNotepad()">📝 Notepad</button>';
  html += '</div>';
  html += '</div>';

  if(STUDENT_MODULES.indexOf(active)>=0){
    const p = computeProgress(active);
    const pct = p.total ? Math.round((p.answered/p.total)*100) : 0;
    html += '<div class="panel-box"><h4>Progress</h4>';
    html += '<div class="progress-label">'+p.answered+' / '+p.total+' answered'+(p.flagged?' · '+p.flagged+' flagged':'')+'</div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
    html += '<div class="nav-grid">';
    p.items.forEach(it=>{
      const cls = ['nav-cell'];
      if(state.selections[it.id]!==undefined) cls.push('answered');
      if(state.flags[it.id]) cls.push('flagged');
      html += '<div class="'+cls.join(' ')+'" onclick="jumpTo(\''+it.id+'\')">'+it.num+'</div>';
    });
    html += '</div></div>';
  }
  sidebar.innerHTML = html;
}

function renderMain(){
  let html = "";
  if(active==="m1"){
    html = renderStudentModule("m1", "Module 1 — Student Edition. Both sections shown below. This module determines routing into the Higher or Lower Module 2 variant (see Compliance Report for the routing threshold). Use the sidebar tools to adjust text size, highlight passages, flag questions, cross out choices, or open the calculator/notepad.");
  } else if(active==="m2h"){
    html = renderStudentModule("m2h", "Module 2 — Higher Route. Delivered to students scoring ≥70% on Module 1. Difficulty is shifted harder than Module 1.");
  } else if(active==="m2l"){
    html = renderStudentModule("m2l", "Module 2 — Lower Route. Delivered to students scoring below 70% on Module 1. Difficulty is shifted easier than Module 1.");
  } else if(active==="key"){
    html = renderKey();
  } else if(active==="teacher"){
    html = renderTeacher();
  } else if(active==="compliance"){
    html = renderCompliance();
  }
  main.innerHTML = html;
}

document.getElementById('taglineText').textContent = "Balanced full form · original content · " + TOTAL_ITEMS + " items";
applyScales();
renderNav();
renderMain();
renderSidebar();
</script>
</body>
</html>
